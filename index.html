<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery - รายการสินค้า</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .category {
            margin-bottom: 50px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .category-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.8em;
            font-weight: bold;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 30px;
        }

        .product-card {
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .product-images {
            position: relative;
            width: 100%;
            height: 250px;
            background: #e9ecef;
            overflow: hidden;
        }

        .product-images img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .product-images img.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .image-nav {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 20px;
        }

        .image-nav span {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .image-nav span.active {
            background: white;
            width: 20px;
            border-radius: 4px;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            word-break: break-word;
        }

        .image-count {
            color: #667eea;
            font-size: 0.95em;
            font-weight: 500;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
                padding: 20px;
            }

            .product-images {
                height: 200px;
            }
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 50px;
            padding: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

        </div>

        <div id="gallery"></div>

        <div class="footer">

    </div>

        function initGallery() {
            const gallery = document.getElementById('gallery');

            Object.entries(galleryData).forEach(([categoryName, categoryData]) => {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';

                const categoryHeader = document.createElement('div');
                categoryHeader.className = 'category-header';
                categoryHeader.textContent = categoryName;
                categoryDiv.appendChild(categoryHeader);

                const productsGrid = document.createElement('div');
                productsGrid.className = 'products-grid';

                const products = categoryData.products || {};

                if (Object.keys(products).length === 0) {
                    productsGrid.innerHTML = '<div class="empty-message">ไม่มีสินค้า</div>';
                } else {
                    Object.entries(products).forEach(([productName, images]) => {
                        if (images.length > 0) {
                            const productCard = document.createElement('div');
                            productCard.className = 'product-card';

                            const imagesDiv = document.createElement('div');
                            imagesDiv.className = 'product-images';

                            const basePath = `${categoryName}/${productName}/`;

                            images.forEach((img, index) => {
                                const imgElement = document.createElement('img');
                                imgElement.src = basePath + encodeURIComponent(img);
                                imgElement.alt = productName;
                                if (index === 0) imgElement.classList.add('active');
                                imagesDiv.appendChild(imgElement);
                            });

                            // Image navigation
                            if (images.length > 1) {
                                const navDiv = document.createElement('div');
                                navDiv.className = 'image-nav';

                                images.forEach((_, index) => {
                                    const dot = document.createElement('span');
                                    if (index === 0) dot.classList.add('active');
                                    dot.onclick = (e) => {
                                        e.stopPropagation();
                                        showImage(imagesDiv, index);
                                    };
                                    navDiv.appendChild(dot);
                                });

                                imagesDiv.appendChild(navDiv);

                                // Auto-rotate images
                                let currentIndex = 0;
                                setInterval(() => {
                                    currentIndex = (currentIndex + 1) % images.length;
                                    showImage(imagesDiv, currentIndex);
                                }, 4000);
                            }

                            productCard.appendChild(imagesDiv);

                            const infoDiv = document.createElement('div');
                            infoDiv.className = 'product-info';
                            infoDiv.innerHTML = `
                                <div class="product-name">${productName}</div>
                                <div class="image-count">📸 ${images.length} รูปภาพ</div>
                            `;
                            productCard.appendChild(infoDiv);

                            productsGrid.appendChild(productCard);
                        }
                    });
                }

                categoryDiv.appendChild(productsGrid);
                gallery.appendChild(categoryDiv);
            });
        }

        function showImage(container, index) {
            const images = container.querySelectorAll('img[alt]');
            const dots = container.querySelectorAll('.image-nav span');

            images.forEach(img => img.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));

            images[index].classList.add('active');
            dots[index].classList.add('active');
        }

        // Initialize gallery when page loads
        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
